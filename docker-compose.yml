# LessonFolk with Postgres, for self-hosting, development and the tests.
#
#   docker compose up -d           # Postgres + the published dashboard image on http://127.0.0.1:4321
#   docker compose up --build      # same, built from this checkout (development)
#   docker compose up -d db        # Postgres only (127.0.0.1:5432), for `npm test`
#   docker compose --profile tools up -d cloudbeaver   # database browser on http://127.0.0.1:8978
#
# Ports only listen on 127.0.0.1. Change them in .env (see .env.example).
# Sign-in: LESSONFOLK_AUTH=none (default, one local learner) or oauth (docs/auth-dev.md).
name: lessonfolk

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: lessonfolk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lessonfolk}
      POSTGRES_DB: lessonfolk
    ports:
      - "127.0.0.1:${LESSONFOLK_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lessonfolk -d lessonfolk"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    # The image published to GHCR on every release: `docker compose up -d` pulls it.
    # `docker compose up -d --build` builds this checkout instead and tags it with the same name.
    image: ghcr.io/cgseb/lessonfolk:${LESSONFOLK_IMAGE_TAG:-latest}
    build: .
    environment:
      DATABASE_URL: postgres://lessonfolk:${POSTGRES_PASSWORD:-lessonfolk}@db:5432/lessonfolk
      LESSONFOLK_AUTH: ${LESSONFOLK_AUTH:-none}
      # The host address the app port is published on (see `ports` below). Inside the
      # container the server listens on 0.0.0.0, so LESSONFOLK_AUTH=none checks this instead.
      LESSONFOLK_BIND: ${LESSONFOLK_BIND:-127.0.0.1}
      LESSONFOLK_BASE_URL: ${LESSONFOLK_BASE_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LESSONFOLK_MCP_TOKEN: ${LESSONFOLK_MCP_TOKEN:-}
    ports:
      - "${LESSONFOLK_BIND:-127.0.0.1}:${LESSONFOLK_PORT:-4321}:4321"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Optional database browser for development (profile "tools": not started by default).
  # The LessonFolk connection is pre-configured; sign in as cbadmin / lessonfolk-dev.
  cloudbeaver:
    profiles: ["tools"]
    image: dbeaver/cloudbeaver:latest@sha256:7298c59289e9519d8913083c85f3ceb475aa12db0f58e87b6491445a9b298d2c
    environment:
      CB_SERVER_NAME: LessonFolk
      CB_ADMIN_NAME: cbadmin
      CB_ADMIN_PASSWORD: lessonfolk-dev
    ports:
      - "127.0.0.1:${LESSONFOLK_CLOUDBEAVER_PORT:-8978}:8978"
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
      - ./docker/cloudbeaver/data-sources.json:/opt/cloudbeaver/conf/initial-data-sources.conf:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  cloudbeaver-data:
