# LessonFolk hosted deployment: Caddy (HTTPS) -> app -> Postgres, on one VPS.
# Lives in /opt/lessonfolk on the server, next to its .env (see .env.example).
# The server deploys each published release by itself: update.sh, run by lessonfolk-update.timer,
# copies the release's deploy/ folder here and runs ./deploy.sh <image tag>.
name: lessonfolk

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD:?Set GLITCHTIP_DB_PASSWORD in .env}@db:5432/glitchtip
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?Set GLITCHTIP_SECRET_KEY in .env}
  # The address its dashboard is opened at (links, sign-in check): localhost through an SSH tunnel, or ADMIN_ADDRESS.
  GLITCHTIP_DOMAIN: http://${ADMIN_ADDRESS:-localhost}:${GLITCHTIP_PORT:-3002}
  VALKEY_URL: ""
  # Without Valkey the tasks wait in Postgres, and the image only starts a web server by default: run the worker inside it.
  GLITCHTIP_EMBED_WORKER: "true"
  # Alert e-mails: an SMTP URL (smtp://user:password@host:587), or leave it to write them to the log.
  EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
  DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
  # Only the first account can be created: nobody else can sign up.
  ENABLE_USER_REGISTRATION: "False"
  ENABLE_ORGANIZATION_CREATION: "False"
  # Errors are kept 30 days, like the server logs (docs/privacy.md).
  GLITCHTIP_RETENTION_DAYS: "30"
  # Hosts the dashboard answers to: its internal name (the app's reports), loopback and ADMIN_ADDRESS.
  ALLOWED_HOSTS: glitchtip,localhost,127.0.0.1,${ADMIN_ADDRESS:-localhost}

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: lessonfolk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lessonfolk
    # No published port: only the app (and the backup scripts, through `docker compose exec`) reach it.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lessonfolk -d lessonfolk"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
    restart: unless-stopped

  app:
    image: ghcr.io/cgseb/lessonfolk:${LESSONFOLK_IMAGE_TAG:-latest}
    environment:
      # The app runs as the least-privilege role lessonfolk_app. The start command applies the
      # migrations and creates/updates that role as the owner (DATABASE_MIGRATION_URL).
      DATABASE_URL: postgres://lessonfolk_app:${LESSONFOLK_APP_DB_PASSWORD:?Set LESSONFOLK_APP_DB_PASSWORD in .env}@db:5432/lessonfolk
      DATABASE_MIGRATION_URL: postgres://lessonfolk:${POSTGRES_PASSWORD}@db:5432/lessonfolk
      LESSONFOLK_APP_DB_PASSWORD: ${LESSONFOLK_APP_DB_PASSWORD}
      LESSONFOLK_AUTH: oauth
      LESSONFOLK_BASE_URL: https://${LESSONFOLK_DOMAIN:?Set LESSONFOLK_DOMAIN in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LESSONFOLK_OPERATOR: ${LESSONFOLK_OPERATOR:-}
      LESSONFOLK_PRIVACY_CONTACT: ${LESSONFOLK_PRIVACY_CONTACT:-}
      LESSONFOLK_GOVERNING_LAW: ${LESSONFOLK_GOVERNING_LAW:-}
      LESSONFOLK_DATA_LOCATION: ${LESSONFOLK_DATA_LOCATION:-}
      # Id of the site in Umami (see .env.example). Without it, no page is measured.
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # Token of the OpenAI plugin directory's domain check, served at /.well-known/openai-apps-challenge.
      OPENAI_APPS_CHALLENGE: ${OPENAI_APPS_CHALLENGE:-}
      # Where unexpected errors are reported: the GlitchTip below, on the internal network (see .env.example).
      # Without it, nothing is reported. Events hold no personal data (docs/privacy.md, "Error monitoring").
      ERROR_REPORT_DSN: ${ERROR_REPORT_DSN:-}
    # No published port: Caddy reaches it on the internal network. Pending migrations are
    # applied by the image's start command before the server starts.
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  # Audience measurement (docs/privacy.md): no cookie, no IP address stored. It has its own
  # database and role (created by deploy.sh), which the app cannot read. Caddy forwards only the
  # tracker script and the collect endpoint to it. Its dashboard is published on this server's
  # loopback address only, or on ADMIN_ADDRESS (see .env.example).
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?Set UMAMI_DB_PASSWORD in .env}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?Set UMAMI_APP_SECRET in .env}
      DISABLE_TELEMETRY: "1"
    ports:
      - "${ADMIN_ADDRESS:-127.0.0.1}:${UMAMI_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  # Error monitoring (docs/privacy.md): GlitchTip, an open-source (MIT) tracker that speaks Sentry's protocol.
  # It has its own database and role (created by deploy.sh), which the app cannot read. Nothing is
  # published to the internet: the app reports to it on the internal network, and its dashboard is on
  # this server's loopback address only, or on ADMIN_ADDRESS (see .env.example). No Valkey/Redis:
  # Postgres holds its queue and cache (fine at this size).
  glitchtip:
    image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    environment: *glitchtip-env
    ports:
      - "${ADMIN_ADDRESS:-127.0.0.1}:${GLITCHTIP_PORT:-3002}:8000"
    mem_limit: 768m
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    logging: *logging
    restart: unless-stopped

  # Applies GlitchTip's database migrations and creates its cache table (it does neither by itself) at every deploy, then stops.
  glitchtip-migrate:
    image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    command: sh -c "./manage.py migrate && ./manage.py createcachetable"
    environment: *glitchtip-env
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    restart: "no"

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    environment:
      LESSONFOLK_DOMAIN: ${LESSONFOLK_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - umami
    logging: *logging
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
