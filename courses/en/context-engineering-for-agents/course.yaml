id: context-engineering-for-agents
title: Context Engineering for Long-Running Agents
level: advanced
theme: building-with-ai
authors: [lessonfolk]
description: "Keep an agent sharp over hours of work: treat the context window as a budget, compact history without losing the thread, keep memory outside the window, and delegate to sub-agents when it helps."
estimatedHours: 2
prerequisites: [ai-agents-and-tools]
