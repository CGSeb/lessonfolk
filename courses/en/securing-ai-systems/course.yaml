id: securing-ai-systems
title: "Securing AI Systems: Threats, Red Teaming and Defence in Depth"
level: advanced
theme: building-with-ai
authors: [lessonfolk]
description: Go beyond guardrails — model the threats to an AI app or agent, understand why prompt injection has no complete fix, stop data from leaking out, design so that a fooled model can do little harm, attack your own system before others do, and respond when something goes wrong. No code needed.
estimatedHours: 2
prerequisites: [connecting-ai-with-mcp, evaluating-ai-output]
