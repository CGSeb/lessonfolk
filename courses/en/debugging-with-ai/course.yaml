id: debugging-with-ai
title: Debugging with AI
level: intermediate
theme: using-ai
authors: [apprentice]
description: Turn your AI assistant into a debugging partner, not a guessing machine — give it the right evidence, read errors together, test ranked hypotheses, fix the root cause instead of the symptom and prove the fix works. Works with any language and any tool.
estimatedHours: 2
prerequisites: [ai-coding-assistants]
lessons:
  - debugging-with-ai/01-giving-the-assistant-what-it-needs
  - debugging-with-ai/02-reading-errors-together
  - debugging-with-ai/03-hypotheses-not-guesses
  - debugging-with-ai/04-root-cause-or-symptom
  - debugging-with-ai/05-verifying-the-fix
  - debugging-with-ai/06-when-the-ai-is-stuck
