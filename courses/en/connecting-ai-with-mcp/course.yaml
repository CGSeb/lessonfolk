id: connecting-ai-with-mcp
title: Connecting AI to Your Tools with MCP
level: intermediate
theme: building-with-ai
authors: [lessonfolk]
description: What the Model Context Protocol (MCP) is, how servers, tools and resources fit together, how to choose and connect them well, and how to keep your data safe from untrusted servers and prompt injection. No code needed.
estimatedHours: 1.25
prerequisites: [ai-agents-and-tools]
