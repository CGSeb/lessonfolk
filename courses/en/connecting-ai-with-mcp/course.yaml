  - connecting-ai-with-mcp/02-servers-tools-and-resources
  - connecting-ai-with-mcp/03-local-and-remote-servers
  - connecting-ai-with-mcp/04-choosing-servers-well
  - connecting-ai-with-mcp/05-trust-and-prompt-injection
