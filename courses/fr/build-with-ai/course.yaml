id: build-with-ai
title: "Construire avec l’IA : votre première application d’IA"
description: Passez de l’utilisation de l’IA à la construction avec elle — appelez un modèle depuis Python, façonnez son comportement, obtenez des sorties structurées, gérez des conversations et livrez un petit chatbot, avec uniquement des outils gratuits.
