id: ai-coding-assistants-for-teams
title: "Assistants de code IA pour les équipes : règles, skills et plugins"
description: Configurez votre assistant de code pour toute une équipe — rédigez un AGENTS.md qu’il suit, délimitez et partagez des règles, empaquetez des workflows en commandes, skills et plugins, et ajoutez des garde-fous avec les permissions et les hooks. Enseigné avec l’outil que vous utilisez, avec les équivalents dans les autres grands outils.
