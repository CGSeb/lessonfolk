id: ai-safety
title: Utiliser l’IA en toute sécurité et avec discernement
description: Utilisez l’IA les yeux ouverts — pourquoi elle peut se tromper avec assurance, comment vérifier les réponses, ce qu’il faut garder privé, d’où viennent les biais et comment utiliser honnêtement du contenu créé par l’IA.
