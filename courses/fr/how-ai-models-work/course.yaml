id: how-ai-models-work
title: Comment fonctionnent vraiment les modèles d’IA
description: Regardez à l’intérieur du modèle qui se cache derrière votre assistant — comment le texte devient des tokens, comment le sens devient des nombres, comment l’entraînement transforme un prédicteur de texte en assistant, ce qu’ajoutent les modèles de raisonnement et comment choisir un modèle. Sans code ni maths.
