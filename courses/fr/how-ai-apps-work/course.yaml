id: how-ai-apps-work
title: "Comment fonctionnent les applications d’IA"
description: Comprenez comment on construit une application d’IA — ce que contient un appel d’API à un modèle, comment un prompt système façonne le comportement, comment obtenir des sorties structurées et entretenir une conversation, et ce qu’il faut prévoir avant de la partager. Aucun code requis.
