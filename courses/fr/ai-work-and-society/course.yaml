id: ai-work-and-society
title: L’IA, le travail et la société
description: Ce que l’IA change pour les métiers et les compétences, comment repérer les fausses voix, les faux visages et les fausses informations, ce que l’IA coûte à l’environnement et qui fixe les règles — un regard lucide sur l’impact de l’IA sur les personnes et le monde.
