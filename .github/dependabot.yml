version: 2

# Update pull requests for what ships: npm packages (all workspaces) every week, GitHub Actions
# (pinned to commit SHAs) and the Docker images every month.
# Major versions of Node and Postgres are ignored: moving the runtime or the database is
# planned and done by hand. Security updates still open a pull request.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node version we run, bumped by hand with the Dockerfile.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  # The images pinned by digest in the compose files (local development and hosted deploy).
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy
    schedule:
      interval: monthly
    ignore:
      # A new Postgres major needs a data migration, and test.yml has to move with it.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
