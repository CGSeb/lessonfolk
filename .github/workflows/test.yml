name: Tests

# Runs on pull requests, and is called by release.yml when a release is
# published (so the tests gate the image build and the deploy).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lessonfolk
          POSTGRES_PASSWORD: lessonfolk
          POSTGRES_DB: lessonfolk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lessonfolk -d lessonfolk"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://lessonfolk:lessonfolk@localhost:5432/lessonfolk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:courses
