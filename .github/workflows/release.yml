name: Release

# When a GitHub release is published (not a pre-release): run the tests on the release's tag,
# build the image and publish it to GHCR, then deploy it to the hosted server (the files in deploy/).
# Deploying needs these in the `production` environment: secrets DEPLOY_HOST, DEPLOY_USER,
# DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (the pinned `ssh-keyscan` output), and optionally the
# variable DEPLOY_URL to check the site after the deploy. Without DEPLOY_HOST the image is still
# published and the deploy is skipped.

on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: meta
        run: |
          # The tag is passed to a remote shell by the deploy job: accept plain tag names only.
          case "$GITHUB_REF_NAME" in *[!A-Za-z0-9._-]*|'') echo "Unsafe release tag." >&2; exit 1;; esac
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: /opt/lessonfolk
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      IMAGE_TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the deploy secrets
        id: configured
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_HOST is not set in the production environment: deploy skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up SSH
        if: steps.configured.outputs.run == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # The host key is pinned (ssh-keyscan on first setup): never trust it blindly.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the deploy files and deploy
        if: steps.configured.outputs.run == 'true'
        run: |
          opts="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          scp $opts -r deploy/. "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh $opts "$DEPLOY_USER@$DEPLOY_HOST" "chmod +x $DEPLOY_PATH/*.sh && $DEPLOY_PATH/deploy.sh $IMAGE_TAG"
      - name: Wait for the site to answer
        if: steps.configured.outputs.run == 'true' && vars.DEPLOY_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$DEPLOY_URL/sign-in"; then
              echo "Site is up."
              exit 0
            fi
            sleep 5
          done
          echo "The site did not answer after the deploy." >&2
          exit 1
