name: Release

# When a GitHub release is published (not a pre-release): run the tests on the release's tag,
# build the image and publish it to GHCR. The hosted server deploys it by itself (deploy/update.sh,
# run by a timer): this workflow holds no key to the server. With the variable DEPLOY_URL in the
# `production` environment, it then waits for the site to show the new version.

on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: |
          # The tag names the image and the server's deploy (deploy/update.sh): accept plain tag names only.
          case "$GITHUB_REF_NAME" in *[!A-Za-z0-9._-]*|'') echo "Unsafe release tag." >&2; exit 1;; esac
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            LESSONFOLK_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The server checks for a new release every 5 minutes: wait until its pages link to this one.
  deployed:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      IMAGE_TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - name: Wait for the site to run the release
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "DEPLOY_URL is not set in the production environment: nothing to check."
            exit 0
          fi
          for i in $(seq 1 50); do
            if curl -fsS "$DEPLOY_URL/sign-in" 2>/dev/null | grep -qF "/releases/tag/$IMAGE_TAG\""; then
              echo "The site runs $IMAGE_TAG."
              exit 0
            fi
            sleep 30
          done
          echo "The site does not run $IMAGE_TAG after 25 minutes: see journalctl -u lessonfolk-update on the server." >&2
          exit 1
