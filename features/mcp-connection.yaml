id: mcp-connection
name: AI tutor connection (MCP)
summary: The /mcp endpoint, its OAuth consent flow and the Connect page that wires a chat app to LessonFolk.
status: stable
owner: mcp
entry_points:
  routes:
    - ALL /mcp
    - GET /connect
    - GET /oauth/consent
    - POST /oauth/consent/decide
    - GET /oauth/sign-in
    - ALL /.well-known/[...path]
    - GET /.well-known/openai-apps-challenge
    - POST /api/account/disconnect-app
  ui:
    - page: /connect
      components:
        - dashboard/src/components/connect/clients.ts
        - dashboard/src/components/CopyButtons.astro
        - dashboard/src/components/account/ConnectedApps.astro
      selectors: []
code:
  paths:
    - dashboard/src/pages/mcp.ts
    - dashboard/src/pages/connect.astro
    - dashboard/src/pages/oauth/**
    - dashboard/src/pages/.well-known/**
    - dashboard/src/pages/api/account/disconnect-app.ts
    - dashboard/src/components/connect/**
    - dashboard/src/components/account/ConnectedApps.astro
    - dashboard/src/lib/connect.ts
    - dashboard/src/lib/connected-apps.ts
    - dashboard/src/lib/openai-challenge.ts
    - packages/mcp/src/**
    - packages/mcp/prompts/**
  models: [oauth_client, oauth_access_token, oauth_refresh_token, oauth_consent, learner, lesson_progress]
depends_on: [authentication]
impacts: [home-learning-path]
rules:
  - Tutor tools read and write only the connected learner's progress; scopes limit what a token may do.
  - In none mode /mcp answers on this computer only (optional LESSONFOLK_MCP_TOKEN).
  - The tokens of a deleted account or a disconnected app stop working immediately.
  - Tutor-only parts of lessons are served to the tutor, never to the public pages.
acceptance:
  - given: oauth mode and no token
    when: POST /mcp
    then: the status is 401 with a WWW-Authenticate header pointing at the OAuth discovery document
  - given: a connected app with a valid token
    when: the user disconnects it from the account page
    then: the next /mcp call with that token is refused
tests:
  harness: [dashboard/tests/e2e/server.ts]   # startDashboard(), visibleText(); needs Postgres (docs/testing.md)
  run: npx vitest run --root dashboard <test file>
  e2e:
    - dashboard/tests/e2e/mcp-none.db.test.ts
    - dashboard/tests/e2e/mcp-oauth.db.test.ts
  unit:
    - dashboard/src/lib/connect.test.ts
    - packages/mcp/src/tools.test.ts
    - packages/mcp/src/scopes.test.ts
    - packages/mcp/src/oauth.test.ts
    - packages/mcp/src/endpoint.test.ts
  coverage_gaps: []
risks:
  - Token leakage; a scope that is too broad; tutor-only content exposed.
