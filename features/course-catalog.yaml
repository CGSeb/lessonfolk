id: course-catalog
name: Course catalog, course pages and authors
summary: Browse, search and filter courses; read a course page with its lessons; see who wrote what.
status: stable
owner: dashboard
entry_points:
  routes:
    - GET /courses
    - GET /courses/[id]
    - GET /projects   # placeholder page only, says no project is open yet
    - GET /authors
    - GET /authors/[slug]
    - GET /api/authors/[slug]/avatar
  ui:
    - page: /courses
      components:
        - dashboard/src/components/CourseCard.astro
      selectors: ['form.catalog-search', 'a.theme-filter']
    - page: /courses/[id]
      components:
        - dashboard/src/components/CourseAuthors.astro
        - dashboard/src/components/StatusBadge.astro
      selectors: ['h3.lesson__title']
code:
  paths:
    - dashboard/src/pages/courses/**
    - dashboard/src/pages/authors/**
    - dashboard/src/pages/projects/**
    - dashboard/src/pages/api/authors/**
    - dashboard/src/components/catalog/**
    - dashboard/src/components/course/**
    - dashboard/src/components/authors/**
    - dashboard/src/components/CourseCard.astro
    - dashboard/src/components/CourseAuthors.astro
    - dashboard/src/components/course-status.ts
    - packages/core/src/courses.ts
    - packages/core/src/lesson-body.ts
    - courses/**
  models: []
depends_on: []
impacts: [home-learning-path, site-pages]
rules:
  - Courses are read from courses/ on every request; a broken course file is reported, not fatal.
  - An unknown course or author answers 404.
  - /projects is a placeholder page for now: it only announces projects (Coming soon).
  - A course credits its authors from courses/authors.yaml.
  - Untranslated lessons of a course are shown in English, marked lang="en", with a notice.
acceptance:
  - given: the course catalog
    when: GET /courses with an unknown theme and page 999
    then: all courses are listed, on page 1
  - given: a course id that does not exist
    when: GET /courses/nope
    then: the status is 404
  - given: an author slug that does not exist
    when: GET /authors/nope
    then: the status is 404
  - given: the LessonFolk author
    when: GET /authors/lessonfolk
    then: the page lists the author's courses with the learner's progress
tests:
  harness: [dashboard/tests/e2e/server.ts]   # startDashboard(), visibleText(); needs Postgres (docs/testing.md)
  run: npx vitest run --root dashboard <test file>
  e2e:
    - dashboard/tests/e2e/pages.db.test.ts
    - dashboard/tests/e2e/language.db.test.ts
  unit:
    - dashboard/src/components/catalog/catalogFilter.test.ts
    - dashboard/src/components/catalog/catalogView.test.ts
    - dashboard/src/components/course/courseView.test.ts
    - dashboard/src/components/authors/authorView.test.ts
    - dashboard/src/components/course-status.test.ts
    - packages/core/src/courses.test.ts
    - packages/core/src/lesson-body.test.ts
  coverage_gaps: []
risks:
  - Changing a lesson id breaks saved learner progress (see docs/course-format.md).
