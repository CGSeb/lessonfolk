# Feature map. Read this index first, then load only the sheets you need.
# Format and rules: features/README.md. Checked by `npm run features -- validate`.
features:
  - id: home-learning-path
    name: Home and learning path
    summary: The learner's home page (next lesson, path, progress) and its live refresh when the tutor saves progress.
    file: features/home-learning-path.yaml
  - id: course-catalog
    name: Course catalog, course pages and authors
    summary: Browse, search and filter courses; read a course page with its lessons; see who wrote what.
    file: features/course-catalog.yaml
  - id: interface-language
    name: Interface language
    summary: English or French UI chosen from the browser or the footer switcher, saved in a cookie.
    file: features/interface-language.yaml
  - id: authentication
    name: Sign-in modes
    summary: No sign-in (one local learner) or OAuth sign-in and sign-out (GitHub, Google, demo), and the current-user endpoint.
    file: features/authentication.yaml
  - id: account-data
    name: Account and personal data
    summary: Account page to export, import and delete progress, list browser sessions and connected apps.
    file: features/account-data.yaml
  - id: mcp-connection
    name: AI tutor connection (MCP)
    summary: The /mcp endpoint, its OAuth consent flow and the Connect page that wires a chat app to LessonFolk.
    file: features/mcp-connection.yaml
  - id: site-pages
    name: Crawler files, legal pages and 404
    summary: robots.txt, sitemap.xml, llms.txt, privacy and terms pages, and the custom 404.
    file: features/site-pages.yaml
